{% extends "pages/base.html" %}
{% block content %}

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="card-title text-center fw-bold mb-4">
            <i class="bi bi-person-plus me-2"></i>Create an Account
          </h3>
          <form method="POST" action="">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-dark w-100 py-2 mt-2 fw-bold">
              Register
            </button>
          </form>
          <p class="text-center text-muted mt-3 mb-0">
            Already have an account?
            <a href="/login/" class="text-dark fw-bold">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>

{% endblock %}
